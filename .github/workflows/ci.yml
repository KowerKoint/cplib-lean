name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Check bundled submission
        run: |
          python3 scripts/bundle.py Cplib.lean -o .lake/CplibBundle.lean
          lake env lean .lake/CplibBundle.lean -o .lake/CplibBundle.olean
