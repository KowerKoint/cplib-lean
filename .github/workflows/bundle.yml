name: Bundle

on:
  push:
    branches: [main]
    paths:
      - Cplib.lean
      - scripts/bundle.py
      - lakefile.toml
      - .github/workflows/bundle.yml
  pull_request:
    branches: [main]
    paths:
      - Cplib.lean
      - scripts/bundle.py
      - lakefile.toml
      - .github/workflows/bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      - name: Check bundled submission
        run: |
          python3 scripts/bundle.py Cplib.lean -o .lake/CplibBundle.lean
          lake env lean .lake/CplibBundle.lean -o .lake/CplibBundle.olean
