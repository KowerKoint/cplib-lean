name = "cplib"
version = "0.1.0"
defaultTargets = ["Cplib"]

# ---------------------------------------------------------------------------
# Libraries
# ---------------------------------------------------------------------------

# Main library: implementations + theorems that build on Lean 4.22.0.
[[lean_lib]]
name = "Cplib"

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

# Mathlib pinned to the AtCoder toolchain (Lean v4.22.0).
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.22.0"

# API documentation generator, pinned to the matching toolchain tag.
# Build docs with:  lake build Cplib:docs
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4"
rev = "v4.22.0"
